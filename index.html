<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClayNest - Register</title>
</head>

<body>
    <style>

body {

    background-color: #f4f0e9;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 1200px;
    max-width: 100%;
    display: flex;
    background-color: #fffdf9;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(60, 40, 20, 0.12);
}


.main_img {
    width: 50%;
    height: auto;
    overflow: hidden;
    align-self: stretch;

}
.main_img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


.form_sec {
    width: 50%;
    padding: 55px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}


.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #492b1b;
    font-family: Georgia, serif;
    font-size: 28px;
    font-weight: bold;
}



h1 {
    font-family: Georgia, serif;
    font-size: 34px;
    line-height: 1.35;
    color: #392619;
    margin-bottom: 16px;
}

.subtitle {
    color: #81766e;
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 35px;
}


.name_sec {
    display: flex;
    gap: 18px;
}


.name_sec .name{
    flex:1;
    min-height: 0;
    width: 50%;
    margin-bottom: 22px;
}

label {
    display: block;
    color: #625a54;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 16px;
    display:block;
    border: 1px solid #d9d3cc;
    border-radius: 9px;
    background-color: transparent;
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
    color: #392619;
}


input:hover {
    border-color: #b7653c;
}
input:focus {
    border-color: #b7653c;
}



.password_box {
    display: flex;
    align-items: center;
    border: 1px solid #d9d3cc;
    border-radius: 9px;
}

.password_box:focus {
    border-color: #b7653c;
}
.password_box:hover {
    border-color: #b7653c;
}

.password_box input {
    border: none;
    flex: 1;
    min-width: 0;
}




#firstNameError {
    color: #d62828;
    font-size: 12px;
    margin-top: 7px;
}
#lastNameError {
    color: #d62828;
    font-size: 12px;
    margin-top: 7px;
}
#emailError{
     color: #d62828;
    font-size: 12px;
    margin-top: 7px;
}
#passwordError{
     color: #d62828;
    font-size: 12px;
    margin-top: 7px;
}




#Btn {
    width: 100%;
    padding: 17px;
    background-color: #b7653c;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 5px;
}

#Btn:hover:not(:disabled) {
    background-color: #98502e;
}

#Btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}
#successPopup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.success_box {
    background-color: #fffdf9;
    width: 90%;
    max-width: 400px;
    padding: 35px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
}

.success_icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: #e4f3e6;
    color: #287a45;
    font-size: 38px;
    line-height: 60px;
    margin: 0 auto 20px;
}

.success_box h2 {
    color: #392619;
    margin-bottom: 12px;
}

.success_box p {
    color: #81766e;
    line-height: 1.6;
    margin-bottom: 25px;
}

.success_box button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background-color: #b7653c;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.success_box button:hover {
    background-color: #98502e;
}


@media (max-width: 800px) {
    body {
        padding: 15px;
    }

    .container {
        flex-direction: column;
    }

    .main_img {
        width: 100%;
        min-height: 280px;
    }

    .form_Sec {
        width: 100%;
        padding: 35px 25px;

    }

    h1 {
        font-size: 27px;
    }
}

@media (max-width: 420px) {
    .name_sec {
        flex-direction: column;
        gap: 0;
    }

    .form_sec {
        padding: 25px 18px;
    }
}
</style>
    <div class="container">
        <div class="main_img">
            <img src="./main_img.jpeg">
        </div>

        <div class="form_sec">

            <div class="logo">
                <h1>🏺 Clayera</h1>
            </div>

            <h1>Register to get started<br>
                to your pottery experience.
            </h1>

            <p class="subtitle">
                Join our creative community and explore
                the joy of working with clay.
            </p>

            <form id="registrationForm">

                <div class="name_sec">

                    <div class="name">
                        <label for="firstName">First Name</label>
                        <input
                            type="text"
                            id="firstName"
                            placeholder="Enter your first name"
                        >
                        <p id="firstNameError"></p>
                    </div>

                    <div class="name">
                        <label for="lastName">Last Name</label>
                        <input
                            type="text"
                            id="lastName"
                            placeholder="Enter your last name"
                        >
                        <p id="lastNameError"></p>
                    </div>

                </div>


        
                <div class="email_sec">
                    <label class="email">Email Address</label>
                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email address"
                    >
                    <p id="emailError"></p>
                </div>
                <br>

                <div class="pass">
                    <label class="password">Create New Password</label>

                    <div class="password_box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            
                        >

                    </div>

                    <p  id="passwordError"></p>
                </div>
                <br>

                <button
                    type="submit"
                    id="Btn"
                    disabled
                >Create Account
                    
                </button>


            </form>

        </div>

    </div>
    <div id="successPopup">
    <div class="success_box">
        <div class="success_icon">✓</div>

        <h2>Registration Successful!</h2>

        <p>Welcome to ClayNest. Your pottery journey starts here!</p>

        <button id="closePopup">
            Continue
        </button>
    </div>
</div>

 <script>
    var form = document.getElementById("registrationForm")

var firstName = document.getElementById("firstName")
var lastName = document.getElementById("lastName")
var email = document.getElementById("email")
var password = document.getElementById("password")

var submitBtn = document.getElementById("Btn")


var firstNameError = document.getElementById("firstNameError")
var lastNameError = document.getElementById("lastNameError")
var emailError = document.getElementById("emailError")
var passwordError = document.getElementById("passwordError")
var successMessage = document.getElementById("successMessage")

function validateForm() {

  

    if (firstName.value !== "") {
        firstNameError.textContent = ""
    } else {
        firstNameError.textContent = "First name is required"
    }

    

    if (lastName.value !== "") {
        lastNameError.textContent = ""
    } else {
        lastNameError.textContent = "Last name is required"
    }


    
    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    var validEmail = emailPattern.test(email.value)

    if (validEmail) {
        emailError.textContent = ""
    } else {
        emailError.textContent = "Please enter a valid email address"
    }



    if (password.value.length>=6) {
        passwordError.textContent = ""
    } else {
        passwordError.textContent =
            "Password must be at least 6 characters"
    }


    submitBtn.disabled = !(firstName.value !== "" && lastName.value !== "" && validEmail && password.value.length>=6 )
   
        


}

firstName.addEventListener("input", validateForm)
lastName.addEventListener("input", validateForm)
email.addEventListener("input", validateForm)
password.addEventListener("input", validateForm)


form.addEventListener("click", function(event) {
    event.preventDefault()

    validateForm()

    if (
        firstName.value !== "" &&
        lastName.value !== "" &&
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value) &&
        password.value.length >= 6
    ) {
        document.getElementById("successPopup").style.display = "flex"

        form.reset();
        
        submitBtn.disabled = true;
    }
});

document.getElementById("closePopup").addEventListener("click", function() {
    document.getElementById("successPopup").style.display = "none";
});
    
    
 </script>

</body>
</html>
